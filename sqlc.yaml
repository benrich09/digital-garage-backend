version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries"
    schema: "supabase/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "internal/db/sqlcgen"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_pointers_for_null_types: true
        # geography columns are never selected raw (see comments in
        # queries/*.sql) so no type override is required for PostGIS.
